name: Stacks
options:
  bundleIdPrefix: com.new-industries
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  # The portable code (StacksKit / StacksSync / StacksServerKit) is defined once
  # in Package.swift and consumed here by path — the same definitions the Linux
  # CLI builds from. Only the targets that must be an app bundle or an
  # IOKit-linked framework stay declared in this file.
  StacksPackage:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  libmobi-swift:
    url: https://github.com/awxkee/libmobi-swift.git
    exactVersion: 1.0.2
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    exactVersion: 2.26.0
  swift-service-lifecycle:
    url: https://github.com/swift-server/swift-service-lifecycle.git
    from: 2.0.0
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.8.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  # The macOS-only device layer (MTP over IOUSBHost). Deliberately not in the
  # SwiftPM package: it links IOKit, never builds for Linux, and will never be
  # part of the iOS app.
  StacksDevices:
    type: framework
    platform: macOS
    sources:
      - path: StacksCore/Devices
      - path: StacksCore/Vendored
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.new-industries.StacksDevices
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: StacksPackage
        product: StacksKit

  Stacks:
    type: application
    platform: macOS
    sources:
      # `Stacks` is the macOS shell (app entry, commands/settings, the
      # device + sharing features, and the AppKit table/toolbar chrome).
      # `StacksUI` is the shared, platform-free UI compiled into both this
      # target and the iOS app: same sources, no module boundary to fight.
      - Stacks
      - StacksUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.new-industries.Stacks
        PRODUCT_NAME: Stacks
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Stacks.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: N7J3BYZ94H
        # Hardened runtime is required for Developer ID notarization. Keep the
        # hardened-runtime-compatible resource entitlements (network.client,
        # device.usb) in Config/Stacks.entitlements in sync with this.
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Stacks
        # Local Network privacy (macOS 15+): browsing/advertising Bonjour
        # services triggers the system prompt — declare the usage string and
        # the services we touch.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Stacks discovers and shares book libraries on your local network.
        # ATS blocks cleartext HTTP to HOSTNAMES (raw IPs are exempt — which
        # is why Bonjour discovery worked while manual hostname connects
        # failed with 'server unreachable'). Local-network exemption: .local
        # hostnames + link-local + LAN addresses, not arbitrary HTTP.
        # Merged with the generated keys (GENERATE_INFOPLIST_FILE). The ATS
        # dictionary AND the NSBonjourServices array live in here: Xcode's
        # INFOPLIST_KEY_ mechanism only encodes scalars, so both were silently
        # dropped when declared as build settings.
        INFOPLIST_FILE: Stacks/Info.plist
        # App Nap suspends idle apps; for an app holding a USB/MTP session this
        # can let the host idle-suspend the device link (Kindle drops ~30s
        # after the last transfer). Opt out so the held session stays live.
        INFOPLIST_KEY_NSAppSleepDisabled: YES
        INFOPLIST_KEY_LSApplicationCategoryType: >-
          public.app-category.productivity
    dependencies:
      - target: StacksDevices
      - package: StacksPackage
        product: StacksKit
      - package: StacksPackage
        product: StacksSync
      - package: StacksPackage
        product: StacksServerKit

  # The iOS app: same code as the Mac except the shell. It compiles StacksUI
  # (the shared views/stores) plus its own iPhone/iPad shells, and deliberately
  # does NOT include StacksDevices (MTP) or StacksServerKit (it is a client).
  StacksIOS:
    type: application
    platform: iOS
    sources:
      - StacksIOS
      - StacksUI
      # The same Icon Composer bundle the Mac app uses. Xcode 26 compiles a
      # top-level `AppIcon.icon` into the platform icon (icns/Assets.car) with
      # no extra build setting.
      - path: Stacks/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.new-industries.Stacks
        PRODUCT_NAME: Stacks
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: N7J3BYZ94H
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Stacks
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Stacks discovers Stacks libraries on your local network.
        # NSBonjourServices + ATS live in this plist: INFOPLIST_KEY_ only
        # encodes scalars, so an array there is silently dropped — which left
        # iOS refusing local-network access with no Settings entry at all.
        INFOPLIST_FILE: Config/Stacks-iOS-Info.plist
    dependencies:
      - package: StacksPackage
        product: StacksKit
      - package: StacksPackage
        product: StacksSync

  StacksCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StacksCoreTests
    resources:
      - path: StacksCoreTests/MobiImport/Fixtures
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: StacksDevices
      - package: StacksPackage
        product: StacksKit
      - package: StacksPackage
        product: StacksSync
      - package: StacksPackage
        product: StacksServerKit
      - package: GRDB
      - package: ZIPFoundation
      - package: libmobi-swift
        product: libmobi
      - package: Hummingbird

  StacksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StacksTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Stacks.app/Contents/MacOS/Stacks
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Stacks

  StacksServer:
    type: tool
    platform: macOS
    sources:
      - StacksServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.new-industries.StacksServer
        GENERATE_INFOPLIST_FILE: YES
        # This helper is a separately built tool, not part of the app archive.
        # Keeping it out lets Xcode treat the archive as a distributable app.
        SKIP_INSTALL: YES
    dependencies:
      - package: StacksPackage
        product: StacksKit
      - package: StacksPackage
        product: StacksSync
      - package: StacksPackage
        product: StacksServerKit
      - package: swift-argument-parser
        product: ArgumentParser

  StacksUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - StacksUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Stacks

schemes:
  StacksIOS:
    build:
      targets:
        StacksIOS: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
  Stacks:
    build:
      targets:
        Stacks: all
        StacksDevices: all
        StacksServer: all
        StacksCoreTests: [test]
        StacksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StacksCoreTests
        - StacksTests
        - StacksUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
